[project]
name = "levelupdiag-medikristal"
version = "1.1.2"
description = "Target-specific LevelUpDiag validation suite for MediKristal"
requires-python = ">=3.10"
dependencies = [
  "tomli>=2.0; python_version < '3.11'",
]

[tool.levelupdiag]
mode = "standalone-medikristal-diagnostics-suite"


[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["levelupdiag_core", "levelupdiag_core.*"]
namespaces = false
